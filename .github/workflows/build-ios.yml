name: Build Stash4iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild -project StashApp.xcodeproj -scheme StashApp -sdk iphoneos -configuration Release archive -archivePath StashApp.xcarchive
        xcodebuild -exportArchive -archivePath StashApp.xcarchive -exportOptionsPlist exportOptions.plist -exportPath . -allowProvisioningUpdates

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StashApp.ipa
        path: StashApp.ipa