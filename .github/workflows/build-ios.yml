name: Build Stash4iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Generate App Icons (from icon-1024.png)
      run: |
        mkdir -p StashApp/Assets.xcassets/AppIcon.appiconset
        
        # Generate all required iOS icon sizes from master 1024x1024
        sips -Z 40 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-20@2x.png
        sips -Z 60 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-20@3x.png
        sips -Z 58 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-29@2x.png
        sips -Z 87 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-29@3x.png
        sips -Z 80 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-40@2x.png
        sips -Z 120 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-40@3x.png
        sips -Z 120 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-60@2x.png
        sips -Z 180 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-60@3x.png
        sips -Z 152 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-76@2x.png
        sips -Z 167 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-83.5@2x.png
        sips -Z 1024 icon-1024.png --out StashApp/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
        
        # Create Contents.json
        cat > StashApp/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
        {
          "images" : [
            {"filename" : "Icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20"},
            {"filename" : "Icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20"},
            {"filename" : "Icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29"},
            {"filename" : "Icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29"},
            {"filename" : "Icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40"},
            {"filename" : "Icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40"},
            {"filename" : "Icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60"},
            {"filename" : "Icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60"},
            {"filename" : "Icon-20@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "20x20"},
            {"filename" : "Icon-20@3x.png", "idiom" : "ipad", "scale" : "3x", "size" : "20x20"},
            {"filename" : "Icon-29@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "29x29"},
            {"filename" : "Icon-40@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "40x40"},
            {"filename" : "Icon-76@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "76x76"},
            {"filename" : "Icon-83.5@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5"},
            {"filename" : "Icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024"}
          ],
          "info" : {"author" : "xcode", "version" : 1}
        }
        EOF

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild -project StashApp.xcodeproj -scheme StashApp -destination 'generic/platform=iOS' -sdk iphoneos -configuration Release archive -archivePath StashApp.xcarchive CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=org.doylerules.stash

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R StashApp.xcarchive/Products/Applications/StashApp.app Payload/
        zip -r StashApp.ipa Payload
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StashApp.ipa
        path: StashApp.ipa
