name: Build Stash4iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Tuist
      run: curl -Ls https://install.tuist.io | sh

    - name: Generate Xcode project
      run: tuist generate

    - name: Build
      run: xcodebuild build -workspace StashApp.xcworkspace -scheme StashApp -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO

    - name: Archive for distribution
      run: xcodebuild archive -workspace StashApp.xcworkspace -scheme StashApp -archivePath StashApp.xcarchive CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: xcodebuild -exportArchive -archivePath StashApp.xcarchive -exportOptionsPlist exportOptions.plist -exportPath .

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StashApp.ipa
        path: StashApp.ipa