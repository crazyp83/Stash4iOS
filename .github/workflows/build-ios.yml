name: Build Stash4iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.app || true

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build
      run: xcodebuild build -project StashApp.xcodeproj -scheme StashApp -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO

    - name: Archive for distribution
      run: xcodebuild archive -project StashApp.xcodeproj -scheme StashApp -archivePath StashApp.xcarchive CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: xcodebuild -exportArchive -archivePath StashApp.xcarchive -exportOptionsPlist exportOptions.plist -exportPath . CODE_SIGNING_ALLOWED=NO

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StashApp.ipa
        path: StashApp.ipa
