name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild -project StashApp.xcodeproj -scheme StashApp -destination 'generic/platform=iOS' -sdk iphoneos -configuration Release archive -archivePath StashApp.xcarchive CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=org.doylerules.stash

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R StashApp.xcarchive/Products/Applications/StashApp.app Payload/
        zip -r StashApp.ipa Payload
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StashApp.ipa
        path: StashApp.ipa
